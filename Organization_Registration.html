<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organization Registration</title>
    <link rel="stylesheet" href="GasByGas_C_Login.css">
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>
    <section class="Organization_Registration">
        <form id="Organization Registration" form name="Organization Registration" method="post" action="Organization_Registration.php">
            <h2>Organization Registration</h2>
            <img src="" alt="Logo">
            <p>Enter your Organization Information...</p>
                <div class="form-group">
                    <label for="businessName">Business Name:</label>
                    <input type="text" id="businessName" name="businessName" placeholder="Enter your business name" required>
                </div>
                <div class="form-group">
                    <label for="registrationNumber">Business Registration Number:</label>
                    <input type="text" id="registrationNumber" name="registrationNumber" placeholder="Enter registration number" required>
                </div>
                <div class="form-group">
                    <label for="contactPhone">Phone Number:</label>
                    <input type="tel" id="contactPhone" name="contactPhone" placeholder="Enter phone number" required>
                </div>
                <div class="form-group">
                    <label for="contactEmail">Email Address:</label>
                    <input type="email" id="contactEmail" name="contactEmail" placeholder="Enter email address" required>
                </div>
                <div class="form-group">
                    <label for="username">Username (Optional):</label>
                    <input type="text" id="username" name="username" placeholder="Enter username">
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" placeholder="Create a secure password" required>
                </div>
                <div class="g-recaptcha" data-sitekey="6LdczLoqAAAAAB6ULrRmg9y2kjFXMpe6ydsrfCyj"></div>
                <!-- Submit and Reset Buttons -->
            <div class="form-actions">
                <button type="reset" class="btn-reset">Clear</button>
                <button type="submit" class="btn-submit">Register</button>
            </div>

            <!-- Login Note -->
            <div class="note">
                <p>Already have an account? <a href="GasByGas_C_Login.html">Login here</a></p>
            </div>
        </form>
    </section>
</body>
</html>
