<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Admin | GasByGas Online</title>
    <link rel="stylesheet" href="adminAdd.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <div class="top-right">
        <a href="dashboardHO.php" class="btn go-dashboard-btn">Back</a>
    </div>
    <div class="content">
        <h1>Add Admin</h1>
    </div>
    <div class="wrapper">
        <form id="addAdminForm" action="addAdmin.php" method="POST">
            <div class="input-box">
                <i class="fas fa-user"></i>
                <input type="text" id="adminName" name="adminName" placeholder="Name" required>
            </div>

            <div class="input-box">
                <i class="fas fa-user-circle"></i>
                <input type="text" id="username" name="username" placeholder="Username" required>
            </div>

            <div class="input-box">
                <i class="fas fa-envelope"></i>
                <input type="email" id="email" name="email" placeholder="Email" required>
            </div>

            <div class="input-box">
                <i class="fas fa-lock"></i>
                <input type="password" id="password" name="password" placeholder="Password" required>
            </div>

            <div class="input-box">
                <input type="password" name="confirm_password" placeholder="Confirm Password" required>
                <i class='bx bxs-lock-alt'></i>
            </div>

            <div class="button-group">
                <button type="submit" class="btn">Save</button>
                <button type="button" class="btn clear-btn" onclick="clearForm()">Clear</button>
            </div>
        </form>
    </div>

    <script>
        // Form validation on submit
        document.getElementById("addAdminForm").addEventListener("submit", function(event) {
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementsByName("confirm_password")[0].value;
    
            // Password validation regex
            const passwordPattern = /^(?=.*[A-Za-z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;
    
            if (!passwordPattern.test(password)) {
                alert("Password must be at least 8 characters long, include one uppercase letter, one lowercase letter, one number, and one special character.");
                event.preventDefault(); // Stop form submission
                return;
            }
    
            if (password !== confirmPassword) {
                alert("Passwords do not match.");
                event.preventDefault(); // Stop form submission
                return;
            }
        });

        // Clear form function
        function clearForm() {
            document.getElementById("addAdminForm").reset();
        }
    </script>
    
</body>
</html>
